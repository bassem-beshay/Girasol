<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Girasol Tours{% endblock %}</title>
</head>
<body style="margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; background-color: #f5f5f5; -webkit-text-size-adjust: 100%;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #f5f5f5;">
        <tr>
            <td align="center" style="padding: 20px 10px;">
                <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width: 600px; width: 100%; background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06);">

                    <!-- Logo Header -->
                    <tr>
                        <td style="background-color: #dce8f5; padding: 20px; text-align: center;">
                            <img src="https://girasoltours.com/static/admin/img/email-logo.jpeg" alt="Girasol Egypt Travel and Tours" width="180" style="display: inline-block; max-width: 180px; width: 180px; height: auto;" />
                        </td>
                    </tr>

                    <!-- Content -->
                    <tr>
                        <td style="padding: 30px 28px;">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="background-color: #f9f9f9; padding: 20px 28px; border-top: 1px solid #eee;">
                            <table width="100%" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td style="text-align: center;">
                                        <p style="color: #555; font-size: 12px; margin: 0 0 4px 0; font-weight: 600;">
                                            Girasol Egypt Tours
                                        </p>
                                        <p style="color: #888; font-size: 11px; margin: 0 0 4px 0;">
                                            Giza, Egypt &bull; Licence: 2208 A
                                        </p>
                                        <p style="color: #888; font-size: 11px; margin: 0 0 12px 0;">
                                            +20 2 3771 5511 &bull; +20 1227 011 900
                                        </p>
                                        {% block footer_links %}
                                        <p style="margin: 0;">
                                            <a href="https://girasoltours.com" style="color: #ea580c; font-size: 11px; text-decoration: none; font-weight: 600;">Visit Website</a>
                                            {% if unsubscribe_url %}
                                            <span style="color: #ccc;"> &nbsp;|&nbsp; </span>
                                            <a href="{{ unsubscribe_url }}" style="color: #999; font-size: 11px; text-decoration: none;">Unsubscribe</a>
                                            {% endif %}
                                        </p>
                                        {% endblock %}
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>
</html>
